<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APOZL - Relay Control Room</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/monitor.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="theme-light">
  <header class="app-header">
    <div class="brand">
      <span class="badge-live">OPS MONITOR</span>
      <h1 class="brand-title">APOZL</h1>
    </div>
    <div class="global-actions">
      <button id="btn-add-team-modal" class="btn btn-primary">+ Register Team</button>
      <button id="btn-start-all" class="btn btn-emerald">Start All</button>
      <button id="btn-pause-all" class="btn btn-amber">Pause All</button>
      <button id="btn-alarm-all" class="btn btn-rose">Sound Siren</button>
      <button id="btn-broadcast" class="btn">Broadcast</button>
    </div>
  </header>

  <main class="monitor-container">
    <section class="teams-grid" id="teams-grid">
      <!-- Live dynamic team cards -->
    </section>

    <aside class="sidebar-panel">
      <div class="panel-card">
        <h3>Live Leaderboard</h3>
        <table class="data-table" id="leaderboard-table">
          <thead>
            <tr><th>Team</th><th>Leg</th><th>Status</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="panel-card">
        <h3>Recent Violations Feed</h3>
        <div class="audit-feed" id="violation-feed"></div>
      </div>
    </aside>
  </main>

  <!-- Create Team Modal -->
  <div id="add-team-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h4>Register New Relay Team</h4>
        <button id="modal-team-close" class="btn-close">&times;</button>
      </div>
      <div class="form-group">
        <label>Team Name</label>
        <input type="text" id="new-team-name" placeholder="e.g. Code Knights" class="form-control">
      </div>
      <div class="form-group">
        <label>Username (used for login)</label>
        <input type="text" id="new-team-user" placeholder="e.g. team_knights" class="form-control">
      </div>
      <div class="form-group">
        <label>Relay Members (comma separated in sequence)</label>
        <input type="text" id="new-team-members" placeholder="Alice, Bob, Charlie" class="form-control">
      </div>
      <div class="modal-actions">
        <button id="btn-create-team-confirm" class="btn btn-primary" style="width: 100%;">Create Team & Init Session</button>
      </div>
    </div>
  </div>

  <!-- Live Code Inspector Modal -->
  <div id="inspector-modal" class="modal hidden">
    <div class="modal-content" style="width: 750px;">
      <div class="modal-header">
        <h4 id="inspector-team-title">Team Workspace Inspection</h4>
        <button id="inspector-close" class="btn-close">&times;</button>
      </div>
      <pre id="inspector-code" class="code-view"></pre>
    </div>
  </div>

  <script type="module" src="js/monitor.js"></script>
</body>
</html>
